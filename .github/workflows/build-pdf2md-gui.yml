name: Build PDF2MD GUI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    name: Windows single-file exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build Windows exe
        shell: pwsh
        run: .\build_pdf2md_gui.ps1 -SkipSmokeTest
      - name: Package Windows release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\pdf2md-gui-windows-x64 | Out-Null
          Copy-Item dist\pdf2md-gui.exe release\pdf2md-gui-windows-x64\ -Force
          Copy-Item dist\pdf2md.config release\pdf2md-gui-windows-x64\ -Force
          Compress-Archive -Path release\pdf2md-gui-windows-x64\* -DestinationPath release\pdf2md-gui-windows-x64.zip -Force
      - uses: actions/upload-artifact@v7
        with:
          name: pdf2md-gui-windows
          path: |
            dist/pdf2md-gui.exe
            dist/pdf2md.config
            release/pdf2md-gui-windows-x64.zip

  macos-arm:
    name: macOS ARM DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build macOS ARM app and DMG
        run: |
          chmod +x ./build_pdf2md_gui_macos_arm.sh
          ./build_pdf2md_gui_macos_arm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pdf2md-gui-macos-arm
          path: |
            dist/pdf2md-gui.app
            dist/pdf2md-gui-macos-arm64.dmg

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos-arm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pdf2md-gui-windows
          path: artifacts/windows
      - uses: actions/download-artifact@v8
        with:
          name: pdf2md-gui-macos-arm
          path: artifacts/macos-arm
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows/release/pdf2md-gui-windows-x64.zip
            artifacts/macos-arm/dist/pdf2md-gui-macos-arm64.dmg